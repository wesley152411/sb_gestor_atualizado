name: Harness de isolamento

# Roda em todo PR e push na main. DORMANT até o projeto Supabase de TESTE estar
# pronto: ligue definindo a variável de repositório HARNESS_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables). Sem isso, o job é
# pulado e a CI fica verde.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  isolation:
    if: ${{ vars.HARNESS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Tudo vem de GitHub Secrets do projeto de TESTE — NUNCA de produção.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_BASE_URL: http://localhost:3000
      # Confirma explicitamente que o alvo é o banco de teste (a guarda exige).
      HARNESS_ALLOW_TEST_DB: 'true'
      # Flag da reativação promocional LIGADA: torna determinístico o caminho de
      # isolamento de /api/promo-messages (sem depender do fallback de dev). O 404
      # da flag DESLIGADA é coberto pelo job promo-flag-off abaixo.
      NEXT_PUBLIC_FEATURE_PROMO_WHATSAPP: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Subir o app (dev) em background
        run: npm run dev &

      - name: Esperar o servidor responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then echo "servidor pronto"; exit 0; fi
            sleep 3
          done
          echo "servidor não respondeu a tempo"; exit 1

      - name: Rodar o harness de isolamento
        run: npm test

  # Job separado para a flag DESLIGADA: prova que /api/promo-messages responde 404
  # (a rota nem existe) inclusive para sessão válida. Roda DEPOIS do job isolation
  # (needs) para não haver corrida de contas de teste no MESMO banco — os dois jobs
  # varrem as mesmas contas por padrão de e-mail. Só as provas da rota promo rodam
  # aqui (-t); o beforeAll do arquivo ainda cria as contas base.
  promo-flag-off:
    if: ${{ vars.HARNESS_ENABLED == 'true' }}
    needs: isolation
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_BASE_URL: http://localhost:3000
      HARNESS_ALLOW_TEST_DB: 'true'
      # Flag DESLIGADA explicitamente: a rota promo deve virar 404.
      NEXT_PUBLIC_FEATURE_PROMO_WHATSAPP: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Subir o app (dev) em background
        run: npm run dev &
      - name: Esperar o servidor responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then echo "servidor pronto"; exit 0; fi
            sleep 3
          done
          echo "servidor não respondeu a tempo"; exit 1
      - name: Provar o 404 da rota promo com a flag desligada
        run: npm test -- -t 'reativação promocional'

  # Rate limiting das rotas públicas: sobe o servidor com a flag LIGADA (enforce) e
  # credenciais Upstash, e roda só tests/rate-limit.test.ts. Roda depois do
  # isolation (needs) para não competir pelo banco. Requer os secrets UPSTASH_*.
  rate-limit:
    if: ${{ vars.HARNESS_ENABLED == 'true' }}
    needs: isolation
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_BASE_URL: http://localhost:3000
      HARNESS_ALLOW_TEST_DB: 'true'
      # Rate limiting LIGADO em enforce para exercitar o 429.
      NEXT_PUBLIC_RATE_LIMIT_ENABLED: 'true'
      # Marca o job para a pré-condição falhar (não pular) se faltar credencial.
      RATE_LIMIT_JOB: '1'
      # Runner do CI (EUA) → Upstash em São Paulo tem latência bem maior que o
      # Netlify→Upstash de prod (8–42ms). Folga o timeout para o fail-open não
      # disparar à toa e sub-contar o limite (senão o teste de fronteira flakeia).
      RATE_LIMIT_TIMEOUT_MS: '3000'
      # URL pode estar como secret OU variável do repo (na Netlify você deixou como
      # variável). Token é sempre secret.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || vars.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Subir o app (dev) em background
        run: npm run dev &
      - name: Esperar o servidor responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then echo "servidor pronto"; exit 0; fi
            sleep 3
          done
          echo "servidor não respondeu a tempo"; exit 1
      - name: Rodar os testes de rate limiting
        run: npx vitest run tests/rate-limit.test.ts

  # ---------------------------------------------------------------------------
  # PROVAS ESTÁTICAS — leem o código-fonte, sem servidor e sem banco. Rodam SEMPRE
  # (sem o gate HARNESS_ENABLED) porque não dependem do projeto Supabase de teste.
  # Segundos de execução; é a rede que pega o erro de empacotamento do proxy antes
  # de gastar 3 minutos de build.
  # ---------------------------------------------------------------------------
  provas-estaticas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Provas estáticas (proxy sem nativo, toda rota privada com gate)
        run: npm run test:static

  # ---------------------------------------------------------------------------
  # BUILD DA NETLIFY — o ponto cego que deixou passar o Prisma no proxy: o harness
  # subia `npm run dev` e nunca CONSTRUÍA nada, então testava um artefato que não é
  # o que vai para produção. `next build` local também não bastava: aquele erro
  # nasce no empacotamento do @netlify/plugin-nextjs (createEdgeHandler), que só
  # roda aqui. Este job executa o build REAL de produção. Não faz deploy.
  # ---------------------------------------------------------------------------
  build-netlify:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Falha com mensagem que se explica sozinha, em vez de um erro obscuro da CLI.
      - name: Conferir os segredos da Netlify
        run: |
          faltando=""
          [ -z "$NETLIFY_AUTH_TOKEN" ] && faltando="$faltando NETLIFY_AUTH_TOKEN"
          [ -z "$NETLIFY_SITE_ID" ] && faltando="$faltando NETLIFY_SITE_ID"
          if [ -n "$faltando" ]; then
            echo "🛑 Pré-condição — secret(s) ausente(s):$faltando"
            echo "   NETLIFY_AUTH_TOKEN: Netlify → User settings → Applications → Personal access tokens → New access token"
            echo "   NETLIFY_SITE_ID:    Netlify → o site → Site configuration → General → Site information → Site ID"
            echo "   Cadastre em: GitHub → repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "segredos presentes"

      # `netlify build` roda o build command do site + os plugins, puxando as
      # variáveis de ambiente do próprio site. É o mesmo caminho do deploy, só que
      # sem publicar. Se o empacotamento quebrar, quebra AQUI.
      - name: Build de produção (mesmo caminho do deploy)
        run: npx --yes netlify-cli@latest build
